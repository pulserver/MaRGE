name: Browser

# MaRGE in Chromium, built for the browser, as the console of pulserver's
# virtual scanner: from the exam's localizer to a reconstructed scan.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pulserver/pulserver
          path: pulserver
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the page
        run: python web/build.py
      - name: Install pulserver and the test tools
        run: |
          python -m pip install "./pulserver[console]" pytest playwright
          python -m playwright install --with-deps chromium
      - name: Serve the page, a reconstruction proxy and the console
        run: |
          mkdir plugins && cp pulserver/tests/plugins/gre2d.py plugins/
          python -m http.server 8000 --bind 127.0.0.1 --directory web/dist > http.log 2>&1 &
          python -m pulserver.proxy --store designs --port 9020 \
            --plugins pulserver/tests/recon_plugins --slots 1 > proxy.log 2>&1 &
          pulserver console --plugins plugins --limits pulserver/docker/limits/limits.txt \
            --store designs --recon 127.0.0.1:9020 --port 8765 --spacing 2 > console.log 2>&1 &
          timeout 120 bash -c 'until (echo > /dev/tcp/127.0.0.1/8765) 2> /dev/null; do sleep 1; done'
      - name: Run MaRGE in Chromium against the console
        env:
          MARGE_WEB: http://127.0.0.1:8000
          MARGE_PULSERVER: ws://127.0.0.1:8765
        run: python -m pytest tests/test_browser.py -v
      - name: Show the services' logs
        if: always()
        run: tail -n 40 console.log proxy.log http.log
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: web/dist

  pages:
    if: github.event_name == 'push'
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
