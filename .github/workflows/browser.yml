name: Browser

# MaRGE in Chromium, built for the browser, as the console of pulserver's
# virtual scanner: from the exam's localizer to a reconstructed scan.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pulserver/pulserver
          path: pulserver
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the page
        run: python web/build.py
      # The image the page tells its users to run, built from pulserver's main
      # branch. It listens on another port than the page's own default, so
      # that the page served here also shows how to start one.
      - name: Build pulserver's image
        run: docker build -f pulserver/docker/Dockerfile -t pulserver pulserver
      - name: Install the test tools
        run: |
          python -m pip install pytest playwright websockets
          python -m playwright install --with-deps chromium
      - name: Serve the page and pulserver's console
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory web/dist > http.log 2>&1 &
          docker run -d --name pulserver -p 127.0.0.1:8766:8765 pulserver
      - name: Run MaRGE in Chromium against the console
        env:
          MARGE_WEB: http://127.0.0.1:8000
          MARGE_PULSERVER: ws://127.0.0.1:8766
        run: python -m pytest tests/test_launcher.py tests/test_browser.py -v
      - name: Show the services' logs
        if: always()
        run: |
          docker logs pulserver 2>&1 | tail -n 40
          tail -n 40 http.log
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: web/dist

  # The batch launcher, which only Windows runs.
  launcher-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_launcher.py -v -p no:cacheprovider

  pages:
    if: github.event_name == 'push'
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
